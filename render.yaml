services:
  - type: web
    name: million-items-manager
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '8080'
      - key: TRUST_PROXY
        value: '1'
      - key: LOG_LEVEL
        value: info
