name: Keep demo awake

# Render's free plan puts the service to sleep after 15 minutes without traffic.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://million-items-manager.onrender.com/api/health
