name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:large
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @mim/web exec playwright install --with-deps chromium
      - run: pnpm --filter @mim/web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results

  load:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @mim/server load --duration 60 --connections 200 --out load.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-report
          path: apps/server/load.json

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker build -t million-items-manager .
      - name: Boot the image and wait for the health check
        run: |
          docker run -d --name app -p 8080:8080 million-items-manager
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' app)" = healthy ] && exit 0; sleep 1
          done
          docker logs app; exit 1
      - name: Smoke (API + SPA from one process)
        run: |
          pnpm smoke http://localhost:8080
          curl -fsS localhost:8080/ | grep -q '<div id="root">'
      - name: Graceful stop (SIGTERM → exit 0 within the timeout)
        run: |
          docker stop -t 15 app
          test "$(docker inspect -f '{{.State.ExitCode}}' app)" = 0
          docker logs app 2>&1 | grep -q 'shutdown complete'
